<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mobri · 모브리</title>
  <meta name="description" content="매일 아침 받는 내 자산 브리핑 — 미국·한국 주식 + 부동산 캘린더" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6366F1" />
  <meta name="application-name" content="Mobri" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="모브리" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <!-- 아이콘 -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app"></main>

  <!-- 하단 탭 네비게이션 -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="tab-btn active" data-tab="calendar">
      <span class="icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      </span>
      캘린더
    </button>
    <button class="tab-btn" data-tab="portfolio">
      <span class="icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </span>
      포트폴리오
    </button>
    <button class="tab-btn" data-tab="charts">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
      </span>
      차트
    </button>
    <button class="tab-btn" data-tab="realestate">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1v-9z"/></svg>
      </span>
      부동산
    </button>
    <button class="tab-btn" data-tab="archive">
      <span class="icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="6" rx="1"/><path d="M5 9v11a1 1 0 001 1h12a1 1 0 001-1V9M10 13h4"/></svg>
      </span>
      아카이브
    </button>
  </nav>

  <!-- 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-handle"></div>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <!-- 날짜 상세 시트 (Bottom Sheet) -->
  <div class="day-sheet-backdrop" id="daySheetBackdrop"></div>
  <div class="day-sheet" id="daySheet">
    <div class="ds-handle-area" id="dsHandleArea">
      <div class="ds-handle"></div>
    </div>
    <button class="ds-close-btn" id="dsCloseBtn" type="button" aria-label="닫기">✕</button>
    <div class="ds-content" id="selectedDayPanel"></div>
  </div>

  <script src="app.js"></script>
  <script>
    // 로컬 개발 모드 감지 (localhost / LAN IP / file:) → SW 비활성화 + 캐시 우회
    const __isDev = (
      location.hostname === 'localhost' ||
      location.hostname === '127.0.0.1' ||
      location.hostname === '' ||
      /^192\.168\./.test(location.hostname) ||
      /^10\./.test(location.hostname) ||
      /^172\.(1[6-9]|2\d|3[0-1])\./.test(location.hostname)
    );

    if (__isDev) {
      // 개발 중에는 등록된 SW 모두 해제 + 캐시 비우기 (한 번)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => r.unregister());
        });
      }
      if (window.caches) {
        caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
      }
      console.log('[Mobri] 로컬 개발 모드 — SW/캐시 비활성화 + 파일 변경 감지 시작');

      // === 브라우저 측 자동 새로고침 (live-server 없이도 동작) ===
      // 1.5초마다 핵심 파일 Last-Modified 폴링 → 변경 감지
      // CSS는 페이지 리로드 없이 link 태그만 교체 (캐시 회피 + UX)
      const __watchFiles = ['app.js', 'styles.css', 'index.html', 'data/calendar-events.json', 'data/portfolio.json'];
      const __mtimes = {};
      let __reloading = false;
      setInterval(async () => {
        if (__reloading) return;
        for (const f of __watchFiles) {
          try {
            const r = await fetch(f + '?_=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
            const m = r.headers.get('Last-Modified') || r.headers.get('ETag') || '';
            if (__mtimes[f] && __mtimes[f] !== m) {
              if (f === 'styles.css') {
                // CSS만 핫 스왑 (페이지 리로드 없이 스타일만 갈아끼움)
                const link = document.querySelector('link[rel="stylesheet"][href*="styles.css"]');
                if (link) {
                  const newLink = link.cloneNode();
                  newLink.href = 'styles.css?_=' + Date.now();
                  newLink.onload = () => link.remove();
                  link.parentNode.insertBefore(newLink, link.nextSibling);
                  console.log('[Mobri] 🎨 styles.css 핫 스왑');
                  __mtimes[f] = m;
                  continue;
                }
              }
              __reloading = true;
              console.log('[Mobri] 🔄 ' + f + ' 변경 감지 — 새로고침');
              location.reload();
              return;
            }
            __mtimes[f] = m;
          } catch (e) { /* 서버 잠깐 끊김은 무시 */ }
        }
      }, 1500);
    } else if ('serviceWorker' in navigator) {
      // === 적극적인 서비스워커 업데이트 전략 ===
      // 1) load 시 SW 등록
      // 2) 등록 즉시 update() 한 번 + 다음 reg에 update listener
      // 3) waiting SW가 있으면 SKIP_WAITING 보내서 즉시 활성화
      // 4) controllerchange 발생하면 페이지 reload (새 SW가 control)
      // 5) 페이지 visible 될 때마다 update() 호출

      let __sw_refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (__sw_refreshing) return;
        __sw_refreshing = true;
        window.location.reload();
      });

      const __sw_promptUpdate = (reg) => {
        if (reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        }
      };

      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('service-worker.js');
          // 즉시 한 번 강제 체크
          reg.update().catch(() => {});

          // 이미 waiting 중인 새 SW가 있으면 활성화 트리거
          __sw_promptUpdate(reg);

          // updatefound — 새 SW 설치 진행 시
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                // 새 SW 설치 완료 + 이미 controller가 있는 상황 = 업데이트
                reg.waiting && reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });

          // 페이지가 보이는 상태가 될 때마다 업데이트 체크
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
              reg.update().catch(() => {});
            }
          });

          // 5분마다 자동 체크 (열어둔 채로 깜빡잊을 때 대비)
          setInterval(() => reg.update().catch(() => {}), 5 * 60 * 1000);
        } catch (e) { /* SW 등록 실패는 조용히 무시 */ }
      });

      // (옵션) 옛 NEW_VERSION 메시지 호환 — 이전 버전 SW에서 보내는 경우
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'NEW_VERSION') {
          if (!__sw_refreshing) {
            __sw_refreshing = true;
            window.location.reload();
          }
        }
      });
    }
  </script>
</body>
</html>
