<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mobri · 모브리</title>
  <meta name="description" content="매일 아침 받는 내 자산 브리핑 — 미국·한국 주식 + 부동산 캘린더" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6366F1" />
  <meta name="application-name" content="Mobri" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="모브리" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <!-- 아이콘 -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app"></main>

  <!-- 하단 탭 네비게이션 -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="tab-btn active" data-tab="calendar">
      <span class="icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      </span>
      캘린더
    </button>
    <button class="tab-btn" data-tab="portfolio">
      <span class="icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </span>
      포트폴리오
    </button>
    <button class="tab-btn" data-tab="charts">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
      </span>
      차트
    </button>
    <button class="tab-btn" data-tab="realestate">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1v-9z"/></svg>
      </span>
      부동산
    </button>
    <button class="tab-btn" data-tab="archive">
      <span class="icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="6" rx="1"/><path d="M5 9v11a1 1 0 001 1h12a1 1 0 001-1V9M10 13h4"/></svg>
      </span>
      아카이브
    </button>
  </nav>

  <!-- 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-handle"></div>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
      // SW가 새 버전 알리면 즉시 새로고침
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'NEW_VERSION') {
          // 한 번만 리로드 (중복 방지)
          if (!window.__reloadingForUpdate) {
            window.__reloadingForUpdate = true;
            window.location.reload();
          }
        }
      });
    }
  </script>
</body>
</html>
